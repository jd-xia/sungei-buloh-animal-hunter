<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字笔顺 · 拼音 · 朗读</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pinyin-pro/3.29.3/index.min.js"></script>
<style>
  :root{
    --pink:#ff8fab; --peach:#ffd6a5; --sky:#a0e7e5; --mint:#b4f8c8;
    --purple:#c9b6ff; --ink:#3c3c50; --paper:#fffaf3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
    background:linear-gradient(160deg,#fff0e5 0%,#eaf6ff 50%,#f3ecff 100%);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:24px 12px 60px;
  }
  h1{ font-size:26px; margin:6px 0 2px; text-align:center;}
  .sub{ color:#7a7a90; margin-bottom:16px; font-size:14px; text-align:center;}

  .card{
    background:var(--paper); border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,0.08);
    max-width:720px; width:100%; padding:18px 20px; margin-top:14px;
  }
  .input-card textarea{
    width:100%; min-height:90px; border-radius:14px; border:2px solid var(--mint);
    padding:10px 12px; font-size:15px; font-family:inherit; resize:vertical;
    outline:none;
  }
  .input-row{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }

  .passage{ font-size:20px; line-height:2.3; letter-spacing:1px; }
  .passage p{ margin:0 0 10px; }
  .ruby-word{ display:inline-flex; flex-direction:column; align-items:center; margin:0 1px; vertical-align:bottom;}
  .py{ font-size:11px; color:#8a6fd8; line-height:1; height:14px; }
  .hz{ transition:all .15s ease; border-radius:6px; padding:1px 3px;}
  .hz.active{ background:var(--pink); color:#fff; box-shadow:0 2px 8px rgba(255,143,171,.6);}
  .punct{ color:#b7b7c8; }

  .mode-tabs{ display:flex; gap:10px; margin-top:16px; }
  .mode-tabs button{
    border:none; border-radius:999px; padding:10px 20px; font-size:14px; font-weight:700;
    background:#fff; color:#9a9ab0; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.06);
  }
  .mode-tabs button.on{ background:var(--purple); color:#fff; }

  .player{
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  #target{
    width:220px; height:220px; background:
      repeating-linear-gradient(0deg,transparent,transparent 27px,#eee 27px,#eee 28px),
      repeating-linear-gradient(90deg,transparent,transparent 27px,#eee 27px,#eee 28px), #fff;
    border:3px dashed var(--purple); border-radius:16px;
  }
  .pinyin-big{ font-size:22px; color:#8a6fd8; font-weight:600; height:30px;}
  .controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
  button{
    border:none; border-radius:999px; padding:9px 18px; font-size:14px;
    background:var(--sky); color:#12505a; cursor:pointer; font-weight:600;
    box-shadow:0 3px 0 rgba(0,0,0,0.1); transition:transform .1s;
  }
  button:active{ transform:translateY(2px); box-shadow:none; }
  button.primary{ background:var(--pink); color:#fff; }
  select, input[type=range]{
    border-radius:999px; padding:8px 14px; border:2px solid var(--mint);
    background:#fff; font-size:14px; font-weight:600; color:var(--ink);
  }

  .filmstrip-wrap{ margin-top:18px; width:100%; }
  .filmstrip-label{ font-size:13px; color:#8a8aa0; margin:0 0 6px 4px;}
  .filmstrip{
    display:flex; gap:8px; overflow-x:auto; scroll-behavior:smooth;
    background:#fff8ef; border-radius:16px; padding:12px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.06);
  }
  .filmstrip::-webkit-scrollbar{ height:6px;}
  .filmstrip::-webkit-scrollbar-thumb{ background:var(--purple); border-radius:6px;}
  .cell{
    flex:0 0 auto; min-width:38px; height:44px; display:flex; align-items:center;
    justify-content:center; border-radius:10px; font-size:20px; color:#9a9ab0;
    background:#fff; transition:all .2s ease;
  }
  .cell.punct{ color:#cfcfe0; font-size:16px; min-width:20px;}
  .cell.now{
    background:var(--peach); color:#a04000; font-weight:700;
    transform:scale(1.15); box-shadow:0 4px 10px rgba(255,180,100,.5);
  }

  .reading-panel{ display:flex; flex-direction:column; align-items:center; gap:10px;}
  .reading-panel .controls{ margin-top:0;}
  .rate-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:#8a8aa0;}
  .pace-row{ display:flex; align-items:center; gap:10px; margin-top:4px; font-size:14px; }
  .pace-row input[type=range]{ width:180px; padding:0; }
  .pace-label{ font-size:13px; color:#8a8aa0; }
  .read-status{ font-size:13px; color:#8a8aa0; min-height:20px; text-align:center;}
  .read-status.warn{ color:#c45c26; font-weight:700;}

  footer{ margin-top:22px; font-size:12px; color:#b0b0c5; text-align:center;}
  .hidden{ display:none !important; }
</style>
</head>
<body>

<h1>🧱 汉字笔顺 · 拼音 · 朗读 🏰</h1>
<div class="sub">输入任意一篇文章，自动生成拼音、笔顺练习和整篇朗读</div>

<div class="card input-card">
  <textarea id="articleInput" placeholder="在这里粘贴或输入一篇新的文章…">星期六下午，我和妹妹在家里玩积木。我们一起搭了一座漂亮的城堡。

玩了一会儿，妹妹想拿走我最喜欢的积木，我不愿意给她，我们就吵了起来。妈妈看见后，对我们说："好东西要和别人分享。"

我听了妈妈的话，觉得很有道理。于是，我把积木分给妹妹，我们一起把城堡搭得更漂亮。

从这件事中，我学会了分享，也觉得和家人一起玩很开心。</textarea>
  <div class="input-row">
    <button class="primary" id="genBtn">✨ 生成</button>
    <button id="clearBtn">🗑 清空</button>
  </div>
</div>

<div class="card">
  <div class="passage" id="passage"></div>
</div>

<div class="mode-tabs">
  <button id="tabPractice" class="on">✏️ 笔顺练习</button>
  <button id="tabRead">📖 整篇阅读</button>
</div>

<div class="card player" id="practicePanel">
  <div id="target"></div>
  <div class="pinyin-big" id="pinyinBig"></div>
  <div class="controls">
    <button class="primary" id="playBtn">⏸ 暂停</button>
    <button id="restartBtn">🔁 从头开始</button>
  </div>
  <div class="pace-row">
    <span>⚡ 快</span>
    <input type="range" id="paceRange" min="0.2" max="4" step="0.2" value="0.8">
    <span>🐢 慢</span>
  </div>
  <div id="paceLabel" class="pace-label">每一笔 0.8 秒</div>
  <div class="filmstrip-wrap">
    <div class="filmstrip-label">📜 逐字滚动</div>
    <div class="filmstrip" id="filmstrip"></div>
  </div>
</div>

<div class="card reading-panel hidden" id="readPanel">
  <div style="font-size:40px;">📖</div>
  <div class="controls">
    <button class="primary" id="readBtn">▶️ 开始朗读</button>
    <button id="stopReadBtn">⏹ 停止</button>
  </div>
  <div class="rate-row">
    朗读语速
    <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="0.9">
    <span id="rateLabel">0.9×</span>
  </div>
  <div class="read-status" id="readStatus">点击开始，听整篇文章朗读</div>
</div>

<footer>点击"逐字滚动"里的任意字，可以单独查看该字的笔顺 👆　朗读功能依赖浏览器自带的语音朗读，效果因浏览器而异</footer>

<script>
const isHanzi = ch => /[\u4e00-\u9fff]/.test(ch);

let sequence = [];      // {char, py, wordEl, cellEl}
let idx = -1;
let playing = true;
let secondsPerStroke = 0.8; // 0.2 (fastest) .. 4.0 (slowest) seconds PER STROKE
let timer = null;
let mode = 'practice';  // 'practice' | 'reading'
let writer = null;
let reading = false;
let pausedReading = false;
let chineseVoice = null;
let keepAliveTimer = null;
let highlightTimer = null;
let speakToken = 0;
let sentenceQueue = [];
let sentencePos = 0;

const passageEl = document.getElementById('passage');
const filmstripEl = document.getElementById('filmstrip');
const pinyinBigEl = document.getElementById('pinyinBig');
const playBtn = document.getElementById('playBtn');
const readBtn = document.getElementById('readBtn');
const readStatus = document.getElementById('readStatus');
const rateRange = document.getElementById('rateRange');
const rateLabel = document.getElementById('rateLabel');

function setReadStatus(text, warn){
  readStatus.textContent = text;
  readStatus.className = 'read-status' + (warn ? ' warn' : '');
}

function pickChineseVoice(){
  if (!('speechSynthesis' in window)) { chineseVoice = null; return null; }
  const voices = speechSynthesis.getVoices() || [];
  const preferred = voices.find(v => /zh-CN/i.test(v.lang) && /female|xiaoxiao|tingting|huihui|yaoyao|google/i.test(v.name))
    || voices.find(v => /zh-CN/i.test(v.lang))
    || voices.find(v => /^zh/i.test(v.lang) || /chinese|中文|普通话|国语/i.test(v.name));
  chineseVoice = preferred || null;
  return chineseVoice;
}

function ensureVoices(){
  if (!('speechSynthesis' in window)) return;
  pickChineseVoice();
  speechSynthesis.onvoiceschanged = () => pickChineseVoice();
}
ensureVoices();

function stopSpeechKeepAlive(){
  if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
}
function startSpeechKeepAlive(){
  // Chrome often stops long utterances unless speechSynthesis is nudged.
  stopSpeechKeepAlive();
  keepAliveTimer = setInterval(() => {
    if (!reading || pausedReading) return;
    try {
      speechSynthesis.pause();
      speechSynthesis.resume();
    } catch (e) {}
  }, 8000);
}

function stopReading(resetButton){
  speakToken++;
  clearTimeout(highlightTimer);
  stopSpeechKeepAlive();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  reading = false;
  pausedReading = false;
  sentenceQueue = [];
  sentencePos = 0;
  if (resetButton !== false) readBtn.textContent = '▶️ 开始朗读';
  clearActive();
}

function buildFromText(rawText){
  clearTimeout(timer);
  stopReading();
  setReadStatus('点击开始，听整篇文章朗读');

  passageEl.innerHTML = '';
  filmstripEl.innerHTML = '';
  sequence = [];

  const paragraphs = rawText.split(/\n\s*\n/).filter(p => p.length);
  const flatChars = [];
  paragraphs.forEach(p => { for (const ch of p) if (ch.trim()) flatChars.push(ch); });

  // batch pinyin conversion (context-aware for polyphonic characters)
  let pyArray = [];
  try {
    pyArray = pinyinPro.pinyin(flatChars.join(''), { type: 'array', toneType: 'symbol' });
  } catch(e){ pyArray = flatChars.map(() => ''); }

  let flatI = 0;
  paragraphs.forEach(para => {
    const p = document.createElement('p');
    for (const ch of para) {
      if (!ch.trim()) continue; // skip stray whitespace inside a paragraph
      const py = isHanzi(ch) ? (pyArray[flatI] || '') : '';
      const wrap = document.createElement('span');
      wrap.className = 'ruby-word';
      const pySpan = document.createElement('span');
      pySpan.className = 'py';
      pySpan.textContent = py;
      const hzSpan = document.createElement('span');
      hzSpan.textContent = ch;
      hzSpan.className = isHanzi(ch) ? 'hz' : 'hz punct';
      wrap.appendChild(pySpan);
      wrap.appendChild(hzSpan);
      p.appendChild(wrap);

      const cell = document.createElement('div');
      cell.textContent = ch;
      cell.className = 'cell' + (isHanzi(ch) ? '' : ' punct');
      const seqIndex = sequence.length;
      cell.addEventListener('click', () => jumpTo(seqIndex));
      filmstripEl.appendChild(cell);

      sequence.push({ char: ch, py, wordEl: hzSpan, cellEl: cell });
      flatI++;
    }
    passageEl.appendChild(p);
  });

  idx = -1;
  playing = true;
  playBtn.textContent = '⏸ 暂停';
  if (mode === 'practice') next();
}

function clearActive(){
  sequence.forEach(s => { s.wordEl.classList.remove('active'); s.cellEl.classList.remove('now'); });
}

function setActive(i){
  const item = sequence[i];
  if (!item) return;
  item.wordEl.classList.add('active');
  item.cellEl.classList.add('now');
  // Only nudge the filmstrip sideways — never scroll the page
  const cell = item.cellEl;
  const left = cell.offsetLeft - (filmstripEl.clientWidth - cell.offsetWidth) / 2;
  filmstripEl.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
}

// HanziWriter draws each stroke over ~400ms at strokeAnimationSpeed = 1.
// We derive strokeAnimationSpeed / delayBetweenStrokes so that the total time
// PER STROKE (draw + gap before the next one) matches the chosen seconds/stroke.
const BASE_STROKE_MS = 400;
function paceParams(secPerStroke){
  const totalPerStrokeMs = secPerStroke * 1000;
  const drawMs = Math.max(totalPerStrokeMs * 0.5, 30);
  const delay = Math.max(totalPerStrokeMs - drawMs, 10);
  const speed = Math.max(0.05, BASE_STROKE_MS / drawMs);
  return { speed, delay };
}

// HanziWriter has no method to change strokeAnimationSpeed / delayBetweenStrokes
// on an existing instance, so we create a fresh instance per character instead.
function createWriterFor(char, speed, delay){
  const targetEl = document.getElementById('target');
  targetEl.innerHTML = '';
  return HanziWriter.create(targetEl, char, {
    width: 220, height: 220, padding: 10,
    strokeAnimationSpeed: speed, delayBetweenStrokes: delay,
    strokeColor: '#7a4fd6', radicalColor: '#ff8fab',
    showOutline: true, outlineColor: '#e5ddff'
  });
}

let playToken = 0; // invalidates stale animateCharacter callbacks after a jump/speed-change/restart

function next(){
  if (mode !== 'practice' || !playing || !sequence.length) return;
  clearActive();
  idx++;
  if (idx >= sequence.length) idx = 0;
  const item = sequence[idx];
  setActive(idx);
  const strokePauseMs = secondsPerStroke * 1000;
  const myToken = ++playToken; // this character "owns" this token

  if (isHanzi(item.char)){
    pinyinBigEl.textContent = item.py || '';
    const { speed, delay } = paceParams(secondsPerStroke);
    writer = createWriterFor(item.char, speed, delay);
    writer.animateCharacter({
      onComplete: () => {
        if (myToken !== playToken) return; // a newer character has since taken over — ignore this stale callback
        timer = setTimeout(() => {
          if (myToken !== playToken) return;
          next();
        }, Math.max(strokePauseMs, 250));
      }
    });
  } else {
    pinyinBigEl.textContent = '';
    timer = setTimeout(() => {
      if (myToken !== playToken) return;
      next();
    }, strokePauseMs);
  }
}

function jumpTo(i){
  if (mode !== 'practice') return;
  clearTimeout(timer);
  clearActive();
  idx = i - 1;
  playing = true;
  playBtn.textContent = '⏸ 暂停';
  next();
}

playBtn.addEventListener('click', (e) => {
  playing = !playing;
  e.target.textContent = playing ? '⏸ 暂停' : '▶️ 继续';
  if (playing) next(); else clearTimeout(timer);
});

document.getElementById('restartBtn').addEventListener('click', () => {
  clearTimeout(timer);
  clearActive();
  idx = -1;
  playing = true;
  playBtn.textContent = '⏸ 暂停';
  next();
});

const paceRange = document.getElementById('paceRange');
const paceLabel = document.getElementById('paceLabel');
secondsPerStroke = parseFloat(paceRange.value);
function updatePaceLabel(){
  const v = secondsPerStroke.toFixed(1).replace(/\.0$/, '');
  if (secondsPerStroke <= 0.2) paceLabel.textContent = '每一笔 ' + v + ' 秒（最快）';
  else if (secondsPerStroke >= 4) paceLabel.textContent = '每一笔 ' + v + ' 秒（最慢）';
  else paceLabel.textContent = '每一笔 ' + v + ' 秒';
}
updatePaceLabel();
paceRange.addEventListener('input', () => {
  secondsPerStroke = parseFloat(paceRange.value);
  updatePaceLabel();
});

// ---- article input ----
document.getElementById('genBtn').addEventListener('click', () => {
  const text = document.getElementById('articleInput').value.trim();
  if (!text) { alert('请先输入一篇文章～'); return; }
  buildFromText(text);
});
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('articleInput').value = '';
  document.getElementById('articleInput').focus();
});

// ---- mode tabs ----
const tabPractice = document.getElementById('tabPractice');
const tabRead = document.getElementById('tabRead');
const practicePanel = document.getElementById('practicePanel');
const readPanel = document.getElementById('readPanel');

tabPractice.addEventListener('click', () => {
  if (mode === 'practice') return;
  mode = 'practice';
  tabPractice.classList.add('on'); tabRead.classList.remove('on');
  practicePanel.classList.remove('hidden'); readPanel.classList.add('hidden');
  stopReading();
  setReadStatus('点击开始，听整篇文章朗读');
  clearActive();
  playing = true; playBtn.textContent = '⏸ 暂停';
  next();
});

tabRead.addEventListener('click', () => {
  if (mode === 'reading') return;
  mode = 'reading';
  tabRead.classList.add('on'); tabPractice.classList.remove('on');
  readPanel.classList.remove('hidden'); practicePanel.classList.add('hidden');
  clearTimeout(timer);
  playToken++; // stop practice animation callbacks
  clearActive();
  pickChineseVoice();
  if (!('speechSynthesis' in window)) {
    setReadStatus('当前浏览器不支持语音朗读，请换 Chrome / Edge 试试', true);
  } else if (!chineseVoice) {
    setReadStatus('未检测到中文语音，仍可尝试朗读（效果可能不佳）', true);
  } else {
    setReadStatus('将使用：' + chineseVoice.name);
  }
});

// ---- whole-article reading (Web Speech API) ----
function splitIntoSentences(items){
  // Build sentence chunks with their start index in `sequence`
  const chunks = [];
  let buf = '';
  let start = 0;
  for (let i = 0; i < items.length; i++) {
    buf += items[i].char;
    if (/[。！？；.!?;]/.test(items[i].char) || i === items.length - 1) {
      const text = buf.trim();
      if (text) chunks.push({ text, start, end: i });
      buf = '';
      start = i + 1;
    }
  }
  if (!chunks.length && items.length) {
    chunks.push({ text: items.map(s => s.char).join(''), start: 0, end: items.length - 1 });
  }
  return chunks;
}

function highlightRangeProgress(start, end, rate, token){
  clearTimeout(highlightTimer);
  const count = Math.max(1, end - start + 1);
  // ~280ms per Chinese char at rate 1.0; punctuation a bit faster
  let i = start;
  const tick = () => {
    if (token !== speakToken || !reading || pausedReading) return;
    if (i > end) return;
    clearActive();
    setActive(i);
    const ch = sequence[i] ? sequence[i].char : '';
    const base = isHanzi(ch) ? 280 : 120;
    const delay = Math.max(60, base / rate);
    i++;
    highlightTimer = setTimeout(tick, delay);
  };
  tick();
}

function speakSentenceAt(pos, token){
  if (token !== speakToken || !reading) return;
  if (pos >= sentenceQueue.length) {
    stopReading();
    setReadStatus('朗读完成 ✓');
    return;
  }

  sentencePos = pos;
  const chunk = sentenceQueue[pos];
  const rate = parseFloat(rateRange.value) || 0.9;
  const utt = new SpeechSynthesisUtterance(chunk.text);
  utt.lang = 'zh-CN';
  utt.rate = rate;
  utt.pitch = 1;
  if (chineseVoice) utt.voice = chineseVoice;

  // Fallback highlighter (Chinese engines often skip onboundary)
  highlightRangeProgress(chunk.start, chunk.end, rate, token);

  utt.onboundary = (e) => {
    if (token !== speakToken || typeof e.charIndex !== 'number') return;
    // Map utterance-local index to sequence index
    const seqIndex = Math.min(chunk.start + e.charIndex, chunk.end);
    clearTimeout(highlightTimer); // boundary is more accurate when available
    clearActive();
    setActive(seqIndex);
  };

  utt.onend = () => {
    if (token !== speakToken) return;
    clearTimeout(highlightTimer);
    // small gap between sentences feels more natural
    setTimeout(() => speakSentenceAt(pos + 1, token), 180);
  };

  utt.onerror = (e) => {
    if (token !== speakToken) return;
    // 'interrupted' / 'canceled' are expected when stopping
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    stopReading();
    setReadStatus('朗读出错：' + (e.error || 'unknown') + '。请再试一次，或换 Chrome / Edge。', true);
  };

  // Chrome: cancel() then immediate speak() often fails silently — delay slightly
  setTimeout(() => {
    if (token !== speakToken || !reading || pausedReading) return;
    speechSynthesis.speak(utt);
  }, 40);
}

function startReading(){
  if (!('speechSynthesis' in window)) {
    setReadStatus('您的浏览器不支持语音朗读功能', true);
    alert('您的浏览器不支持语音朗读功能，请使用 Chrome 或 Edge');
    return;
  }
  if (!sequence.length) {
    setReadStatus('请先生成文章内容', true);
    return;
  }

  pickChineseVoice();
  stopReading(false);
  const token = ++speakToken;
  sentenceQueue = splitIntoSentences(sequence);
  sentencePos = 0;
  reading = true;
  pausedReading = false;
  readBtn.textContent = '⏸ 暂停';
  setReadStatus(chineseVoice ? ('朗读中…（' + chineseVoice.name + '）') : '朗读中…');
  startSpeechKeepAlive();

  // Prime synthesis engine (helps some browsers after cancel)
  speechSynthesis.cancel();
  setTimeout(() => speakSentenceAt(0, token), 80);
}

function pauseReading(){
  if (!reading || pausedReading) return;
  pausedReading = true;
  clearTimeout(highlightTimer);
  stopSpeechKeepAlive();
  try { speechSynthesis.pause(); } catch (e) {}
  readBtn.textContent = '▶️ 继续';
  setReadStatus('已暂停');
}

function resumeReading(){
  if (!reading || !pausedReading) return;
  pausedReading = false;
  readBtn.textContent = '⏸ 暂停';
  setReadStatus(chineseVoice ? ('朗读中…（' + chineseVoice.name + '）') : '朗读中…');
  startSpeechKeepAlive();
  try {
    // If pause left the queue empty (Chrome quirk), restart from current sentence
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
    } else if (!speechSynthesis.speaking) {
      const token = speakToken;
      speakSentenceAt(sentencePos, token);
    }
  } catch (e) {
    const token = speakToken;
    speakSentenceAt(sentencePos, token);
  }
}

rateLabel.textContent = rateRange.value + '×';
rateRange.addEventListener('input', () => {
  rateLabel.textContent = rateRange.value + '×';
});

readBtn.addEventListener('click', () => {
  if (!reading) startReading();
  else if (pausedReading) resumeReading();
  else pauseReading();
});

document.getElementById('stopReadBtn').addEventListener('click', () => {
  stopReading();
  setReadStatus('已停止');
});

// ---- init ----
buildFromText(document.getElementById('articleInput').value);
</script>
</body>
</html>
