<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Odd Number Adventure · Treasure Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a2118;
    --ink-soft: #5c4a38;
    --cream: #fff8e7;
    --panel: #fffaf0;
    --wood: #8b5a2b;
    --wood-dark: #5c3818;
    --gold: #f0b429;
    --gold-dark: #c48512;
    --coral: #e85d4a;
    --leaf: #3f8f4a;
    --sky: #6ec4e0;
    --shadow: 0 12px 28px rgba(42, 33, 24, 0.22);
    --display: "Fredoka", sans-serif;
    --body: "Nunito", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: var(--body);
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 70% 0%, #9ed9ef 0%, transparent 55%),
      linear-gradient(180deg, #7ec8e3 0%, #8ecf9a 42%, #3f8f4a 72%, #246b45 100%);
    overflow-x: hidden;
  }

  .scene {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .game {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 14px 40px;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #fff;
    background: rgba(0,0,0,0.22);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: 13px;
    backdrop-filter: blur(6px);
  }

  .title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title {
    font-family: var(--display);
    background: linear-gradient(160deg, #8b5a2b, #5c3818);
    color: #fff5c7;
    border: 3px solid #d4a24a;
    border-radius: 16px;
    padding: 10px 18px;
    box-shadow: 0 6px 0 #3d2410, var(--shadow);
    font-size: clamp(20px, 4vw, 30px);
    letter-spacing: 0.5px;
  }

  .stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--cream);
    border: 3px solid #d4a24a;
    border-radius: 14px;
    padding: 8px 12px;
    font-weight: 800;
    box-shadow: 0 4px 0 #6b431b;
    min-width: 76px;
    text-align: center;
    font-size: 12px;
    line-height: 1.35;
  }
  .stat span {
    display: block;
    font-size: 18px;
    color: var(--coral);
    font-family: var(--display);
  }

  .main {
    margin-top: 18px;
    background: var(--panel);
    border: 5px solid var(--wood);
    border-radius: 24px;
    padding: 22px 18px 26px;
    box-shadow: 0 10px 0 rgba(62, 39, 12, 0.45), var(--shadow);
  }

  .level-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .level {
    color: var(--coral);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  .ask-chip {
    background: #ffe8c8;
    border: 2px solid #e0a85a;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 800;
    color: #8a4a12;
  }

  h1 {
    font-family: var(--display);
    text-align: center;
    font-size: clamp(22px, 4.5vw, 34px);
    margin: 8px 0 14px;
    color: #3a2814;
  }

  .question {
    text-align: center;
    font-size: clamp(17px, 3.2vw, 24px);
    font-weight: 800;
    line-height: 1.55;
    margin: 0 auto 18px;
    max-width: 820px;
  }
  .question .hl {
    color: var(--coral);
    background: #ffe6df;
    border-radius: 8px;
    padding: 0 6px;
  }

  .equation {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0 20px;
  }

  .chest-slot {
    width: 108px;
    text-align: center;
  }

  .chest-svg {
    width: 108px;
    height: 96px;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 6px 0 rgba(60, 30, 10, 0.35));
    transition: transform .25s ease;
  }
  .chest-slot.unlocked .chest-svg {
    transform: translateY(-4px) scale(1.04);
  }

  .chest-label {
    margin-top: 6px;
    min-height: 28px;
    font-family: var(--display);
    font-size: 20px;
    font-weight: 700;
    color: var(--wood-dark);
  }
  .chest-label.mystery {
    color: #b08a55;
    letter-spacing: 1px;
    font-size: 16px;
  }

  .op {
    font-family: var(--display);
    font-size: 36px;
    font-weight: 700;
    padding-bottom: 34px;
    color: var(--wood-dark);
  }

  .sum-box {
    min-width: 88px;
    background: linear-gradient(180deg, #ffd36b, #f0a93a);
    border: 4px solid #c48512;
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: 0 6px 0 #9a6515;
    margin-bottom: 28px;
  }
  .sum-box .sum {
    font-family: var(--display);
    font-size: 36px;
    color: #8a220f;
    line-height: 1;
  }
  .sum-box small {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: #7a4a10;
    margin-top: 4px;
  }

  .guide {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 14px;
    align-items: start;
    max-width: 860px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #f3f9e8, #e8f4d6);
    border: 3px dashed #6fa85a;
    border-radius: 20px;
    padding: 14px;
  }

  .owl { width: 88px; height: 88px; }
  .guide-body { min-width: 0; }

  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .step-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 900;
    background: #d9e7c8;
    border: 2px solid #8bb06e;
    color: #4d6b3a;
    transition: transform .2s, background .2s;
  }
  .step-dot.on {
    background: var(--gold);
    border-color: var(--gold-dark);
    color: #5c3a08;
    transform: scale(1.12);
  }
  .step-dot.done {
    background: #7ed957;
    border-color: #3f8f4a;
    color: #1f4d22;
  }

  .step-title {
    font-family: var(--display);
    font-size: 18px;
    margin: 0 0 6px;
    color: #2f5a28;
  }

  .step-text {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
  }
  .step-text b { color: var(--coral); }

  .step-visual {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .token {
    background: #fff;
    border: 3px solid #8bb06e;
    border-radius: 12px;
    padding: 6px 12px;
    font-family: var(--display);
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 3px 0 #6a8a52;
  }
  .token.mid {
    background: #fff3c4;
    border-color: #e0a85a;
    box-shadow: 0 3px 0 #c48512;
  }
  .token.big {
    background: #ffe0d8;
    border-color: var(--coral);
    box-shadow: 0 3px 0 #b13c1d;
  }
  .token.ghost {
    opacity: 0.45;
    border-style: dashed;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }

  button.answer {
    border: 4px solid #87602e;
    border-radius: 16px;
    background: linear-gradient(180deg, #fff6df, #f0e0b8);
    padding: 16px 8px;
    font-family: var(--display);
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 0 #71501f;
    color: var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  button.answer:hover:not(:disabled) { transform: translateY(-3px); }
  button.answer:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #71501f;
  }
  button.answer:disabled { cursor: default; opacity: 0.85; }
  button.answer.correct {
    background: linear-gradient(180deg, #c8f09a, #8fd35a);
    border-color: #3f8f4a;
  }
  button.answer.wrong {
    background: linear-gradient(180deg, #ffb4a8, #f07a68);
    border-color: #a6382a;
  }

  .message {
    text-align: center;
    min-height: 48px;
    margin: 16px auto 0;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .message.win { color: #1f6b2a; }
  .message.lose { color: #a6382a; }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .action {
    border: 0;
    border-radius: 14px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(160deg, #8b5a2b, #5c3818);
    color: #fff8e7;
    box-shadow: 0 4px 0 #3d2410;
  }
  .action.secondary {
    background: linear-gradient(160deg, #4a9ad8, #2f6fa8);
    box-shadow: 0 4px 0 #1f4d72;
  }
  .action.accent {
    background: linear-gradient(160deg, #e85d4a, #c03a28);
    box-shadow: 0 4px 0 #8a2418;
  }
  .action:active { transform: translateY(2px); box-shadow: 0 2px 0 #3d2410; }

  .progress {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .bubble {
    min-width: 40px;
    height: 40px;
    padding: 0 8px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: #f1d35d;
    border: 3px solid #8a671c;
    font-weight: 900;
    font-size: 13px;
  }
  .bubble.active {
    background: #ff9f2f;
    transform: scale(1.12);
  }
  .bubble.done { background: #8fd35a; border-color: #3f8f4a; }
  .bubble.future { background: #d9d4c8; border-color: #a39b8c; color: #6b655a; }

  .footer {
    text-align: center;
    color: #fff;
    font-weight: 800;
    margin: 18px 0 0;
    text-shadow: 1px 2px #31582e;
    font-size: 13px;
  }

  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .piece {
    position: absolute;
    width: 10px;
    height: 16px;
    border-radius: 2px;
    animation: fall 1.5s linear forwards;
  }
  @keyframes fall {
    from { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 700px) {
    .guide { grid-template-columns: 1fr; }
    .owl { margin: 0 auto; }
    .choices { grid-template-columns: repeat(2, 1fr); }
    .chest-slot { width: 86px; }
    .chest-svg { width: 86px; height: 76px; }
    .op { font-size: 28px; padding-bottom: 28px; }
    .sum-box { min-width: 70px; padding: 10px 8px; margin-bottom: 24px; }
    .sum-box .sum { font-size: 28px; }
  }
</style>
</head>
<body>

<svg class="scene" aria-hidden="true" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5faf55"/>
      <stop offset="100%" stop-color="#3d8a42"/>
    </linearGradient>
  </defs>
  <ellipse cx="12%" cy="14%" rx="70" ry="28" fill="#fff" opacity="0.85"/>
  <ellipse cx="18%" cy="14%" rx="42" ry="34" fill="#fff" opacity="0.85"/>
  <ellipse cx="78%" cy="10%" rx="60" ry="24" fill="#fff" opacity="0.75"/>
  <ellipse cx="84%" cy="10%" rx="36" ry="28" fill="#fff" opacity="0.75"/>
  <circle cx="88%" cy="18%" r="46" fill="#ffd166"/>
  <circle cx="88%" cy="18%" r="34" fill="#ffe08a"/>
  <path d="M0,78% C18%,68% 32%,82% 50%,72% C68%,62% 82%,78% 100%,70% L100%,100% L0,100% Z" fill="url(#hillA)" opacity="0.55"/>
</svg>

<div class="game">
  <div class="top">
    <div class="title-wrap">
      <a class="home" href="../index.html">← Home</a>
      <div class="title">Odd Number Adventure</div>
    </div>
    <div class="stats">
      <div class="stat">Score<span id="score">0</span></div>
      <div class="stat">Streak<span id="streak">0</span></div>
      <div class="stat">Round<span id="round">1</span></div>
      <div class="stat">Timer<span id="time">45</span></div>
    </div>
  </div>

  <section class="main">
    <div class="level-row">
      <div class="level">LEVEL 38 · Treasure Quest</div>
      <div class="ask-chip" id="askChip">Goal: Find the largest number</div>
    </div>
    <h1 id="headline">Unlock the three chests!</h1>

    <div class="question" id="question"></div>

    <div class="equation" id="equation" aria-label="Treasure chest equation"></div>

    <div class="guide">
      <svg class="owl" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="60" cy="72" rx="38" ry="34" fill="#c48a3a"/>
        <ellipse cx="60" cy="72" rx="26" ry="24" fill="#f3d7a8"/>
        <circle cx="42" cy="48" r="18" fill="#c48a3a"/>
        <circle cx="78" cy="48" r="18" fill="#c48a3a"/>
        <circle cx="42" cy="50" r="12" fill="#fff"/>
        <circle cx="78" cy="50" r="12" fill="#fff"/>
        <circle cx="44" cy="52" r="5" fill="#2a2118"/>
        <circle cx="80" cy="52" r="5" fill="#2a2118"/>
        <polygon points="60,58 48,70 72,70" fill="#e8913a"/>
        <path d="M28 34 Q42 10 54 34" fill="#8b5a2b"/>
        <path d="M66 34 Q78 10 92 34" fill="#8b5a2b"/>
        <ellipse cx="28" cy="78" rx="10" ry="16" fill="#a8732e"/>
        <ellipse cx="92" cy="78" rx="10" ry="16" fill="#a8732e"/>
        <path d="M48 96 Q60 104 72 96" stroke="#8b5a2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="guide-body">
        <div class="steps" id="stepDots"></div>
        <h2 class="step-title" id="stepTitle">Step 1</h2>
        <p class="step-text" id="stepText"></p>
        <div class="step-visual" id="stepVisual"></div>
      </div>
    </div>

    <div class="choices" id="choices"></div>
    <div class="message" id="message"></div>

    <div class="actions">
      <button class="action secondary" type="button" id="btnPrevStep">Previous tip</button>
      <button class="action" type="button" id="btnNextStep">Next tip</button>
      <button class="action accent" type="button" id="btnNextQ">Next puzzle</button>
    </div>

    <div class="progress" id="progress"></div>
  </section>

  <div class="footer">Solve the puzzle · Unlock the treasure · Become a Math Explorer</div>
</div>

<div class="confetti" id="confetti"></div>

<script>
(function () {
  const TIME_LIMIT = 45;
  const ASK_TYPES = [
    { id: "largest", label: "Goal: Find the largest number", ask: "largest natural number", headline: "Unlock the biggest chest!" },
    { id: "middle", label: "Goal: Find the middle number", ask: "middle number", headline: "Find the middle key!" },
    { id: "smallest", label: "Goal: Find the smallest number", ask: "smallest natural number", headline: "Unlock the smallest chest!" }
  ];

  const CHEST_COLORS = [
    { lid: "#4b9ad8", body: "#276da5", shine: "#7ec4ef" },
    { lid: "#73b955", body: "#478b32", shine: "#a6e07a" },
    { lid: "#a66dd1", body: "#7040a4", shine: "#c9a0ea" }
  ];

  let score = 0;
  let streak = 0;
  let round = 1;
  let time = TIME_LIMIT;
  let timer = null;
  let finished = false;
  let step = 0;
  let puzzle = null;

  const el = {
    score: document.getElementById("score"),
    streak: document.getElementById("streak"),
    round: document.getElementById("round"),
    time: document.getElementById("time"),
    askChip: document.getElementById("askChip"),
    headline: document.getElementById("headline"),
    question: document.getElementById("question"),
    equation: document.getElementById("equation"),
    stepDots: document.getElementById("stepDots"),
    stepTitle: document.getElementById("stepTitle"),
    stepText: document.getElementById("stepText"),
    stepVisual: document.getElementById("stepVisual"),
    choices: document.getElementById("choices"),
    message: document.getElementById("message"),
    progress: document.getElementById("progress"),
    confetti: document.getElementById("confetti")
  };

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function oddAround(n, delta) {
    let x = n + delta;
    if (x % 2 === 0) x += delta > 0 ? 1 : -1;
    return Math.max(1, x);
  }

  function makePuzzle() {
    const middle = randInt(5, 31) * 2 + 1;
    const a = middle - 2;
    const b = middle;
    const c = middle + 2;
    const sum = a + b + c;
    const ask = pick(ASK_TYPES);
    const answer =
      ask.id === "largest" ? c :
      ask.id === "middle" ? b : a;

    const distractors = new Set();
    while (distractors.size < 3) {
      const pool = [
        a - 2, a + 2, b - 2, b + 2, c - 2, c + 2,
        sum, Math.floor(sum / 2), middle + 4, middle - 4,
        oddAround(answer, 2), oddAround(answer, -2), answer + 1, answer - 1
      ].filter(n => n > 0 && n !== answer && n % 2 === 1);
      distractors.add(pick(pool.length ? pool : [answer + 2]));
    }

    return {
      a, b, c, sum, ask, answer,
      choices: shuffle([answer, ...distractors])
    };
  }

  function chestSVG(color, unlocked, value) {
    const open = unlocked
      ? `<path d="M18 46 L18 28 Q60 8 102 28 L102 46" fill="${color.lid}"/>
         <path d="M18 28 Q60 12 102 28" fill="${color.shine}" opacity="0.35"/>
         <rect x="46" y="18" width="28" height="14" rx="3" fill="#ffd34d" stroke="#9a6515" stroke-width="3"/>
         <text x="60" y="72" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="22" font-weight="700" fill="#fff8e7">${value}</text>`
      : `<path d="M18 46 L18 34 Q60 18 102 34 L102 46" fill="${color.lid}"/>
         <path d="M18 34 Q60 22 102 34" fill="${color.shine}" opacity="0.3"/>
         <rect x="48" y="52" width="24" height="20" rx="4" fill="#ffd34d" stroke="#9a6515" stroke-width="3"/>
         <path d="M52 52 V42 a8 8 0 0 1 16 0 V52" fill="none" stroke="#9a6515" stroke-width="4"/>
         <circle cx="60" cy="62" r="3" fill="#9a6515"/>`;

    return `
      <svg class="chest-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="92" rx="42" ry="6" fill="rgba(0,0,0,0.18)"/>
        <rect x="16" y="46" width="88" height="42" rx="8" fill="${color.body}"/>
        <rect x="16" y="46" width="88" height="14" fill="${color.lid}"/>
        <rect x="20" y="50" width="80" height="4" fill="${color.shine}" opacity="0.25"/>
        ${open}
      </svg>`;
  }

  function renderEquation(revealMode) {
    const nums = [puzzle.a, puzzle.b, puzzle.c];
    const labels = ["small", "middle", "large"];
    const unlockedAt = (i) => {
      if (revealMode >= 3) return true;
      if (revealMode === 1) return i === 1;
      return false;
    };
    let html = "";
    for (let i = 0; i < 3; i++) {
      const unlocked = unlockedAt(i);
      html += `<div class="chest-slot ${unlocked ? "unlocked" : ""}">
        ${chestSVG(CHEST_COLORS[i], unlocked, nums[i])}
        <div class="chest-label ${unlocked ? "" : "mystery"}">${unlocked ? nums[i] : "? " + labels[i]}</div>
      </div>`;
      if (i < 2) html += `<div class="op">+</div>`;
    }
    html += `<div class="op">=</div>
      <div class="sum-box"><div class="sum">${puzzle.sum}</div><small>sum</small></div>`;
    el.equation.innerHTML = html;
  }

  function stepsForPuzzle() {
    const { a, b, c, sum, ask } = puzzle;
    return [
      {
        title: "Step 1: Meet consecutive odd numbers",
        text: `Consecutive odd numbers go up like stairs: add <b>2</b> each time. The three chests look like <b>small, middle, large</b>, with a gap of 2.`,
        visual: [
          { t: "small", cls: "ghost" },
          { t: "+2", cls: "ghost" },
          { t: "middle", cls: "mid" },
          { t: "+2", cls: "ghost" },
          { t: "large", cls: "big" }
        ],
        reveal: 0
      },
      {
        title: "Step 2: Find the middle key first",
        text: `Secret weapon: sum of three consecutive odd numbers ÷ 3 = <b>the middle number</b>.<br>${sum} ÷ 3 = <b>${b}</b>. Unlock the middle chest first!`,
        visual: [
          { t: String(sum), cls: "" },
          { t: "÷ 3", cls: "ghost" },
          { t: String(b), cls: "mid" }
        ],
        reveal: 1
      },
      {
        title: "Step 3: Build all three chests",
        text: `Middle is <b>${b}</b>. Subtract 2 on the left, add 2 on the right:<br><b>${a}</b>, <b>${b}</b>, <b>${c}</b>. Check: ${a}+${b}+${c}=${sum} ✓`,
        visual: [
          { t: String(a), cls: "" },
          { t: String(b), cls: "mid" },
          { t: String(c), cls: "big" }
        ],
        reveal: 3
      },
      {
        title: "Step 4: Answer the quest goal",
        text: `This puzzle asks for the <b>${ask.ask}</b>.<br>So the answer is <b>${
          ask.id === "largest" ? c : ask.id === "middle" ? b : a
        }</b>. Pick it to unlock the treasure!`,
        visual: [
          { t: String(a), cls: ask.id === "smallest" ? "big" : "ghost" },
          { t: String(b), cls: ask.id === "middle" ? "big" : "ghost" },
          { t: String(c), cls: ask.id === "largest" ? "big" : "ghost" }
        ],
        reveal: 3
      }
    ];
  }

  function renderStep() {
    const steps = stepsForPuzzle();
    const s = steps[step];

    el.stepDots.innerHTML = steps.map((_, i) => {
      const cls = i < step ? "done" : i === step ? "on" : "";
      return `<div class="step-dot ${cls}">${i + 1}</div>`;
    }).join("");

    el.stepTitle.textContent = s.title;
    el.stepText.innerHTML = s.text;
    el.stepVisual.innerHTML = s.visual
      .map(v => `<span class="token ${v.cls}">${v.t}</span>`)
      .join("");

    renderEquation(s.reveal);

    document.getElementById("btnPrevStep").disabled = step <= 0;
    document.getElementById("btnNextStep").textContent =
      step >= steps.length - 1 ? "Review tips" : "Next tip";
  }

  function renderChoices() {
    el.choices.innerHTML = "";
    puzzle.choices.forEach(n => {
      const btn = document.createElement("button");
      btn.className = "answer";
      btn.type = "button";
      btn.textContent = n;
      btn.addEventListener("click", () => choose(btn, n));
      el.choices.appendChild(btn);
    });
  }

  function renderProgress() {
    const start = Math.max(1, round - 2);
    let html = "";
    for (let i = start; i < start + 6; i++) {
      let cls = "future";
      if (i < round) cls = "done";
      if (i === round) cls = "active";
      html += `<div class="bubble ${cls}">${i}</div>`;
    }
    el.progress.innerHTML = html;
  }

  function startTimer() {
    clearInterval(timer);
    time = TIME_LIMIT;
    el.time.textContent = time;
    timer = setInterval(() => {
      if (finished) return;
      time -= 1;
      el.time.textContent = time;
      if (time <= 0) {
        clearInterval(timer);
        finished = true;
        el.message.className = "message lose";
        el.message.innerHTML = "Time's up! The chests are still locked. Tap <b>Next puzzle</b> to try again!";
        document.querySelectorAll(".answer").forEach(b => { b.disabled = true; });
      }
    }, 1000);
  }

  function loadPuzzle(keepScore) {
    finished = false;
    step = 0;
    puzzle = makePuzzle();

    if (!keepScore) {
      score = 0;
      streak = 0;
      round = 1;
    }

    el.score.textContent = score;
    el.streak.textContent = streak;
    el.round.textContent = round;
    el.askChip.textContent = puzzle.ask.label;
    el.headline.textContent = puzzle.ask.headline;
    el.question.innerHTML =
      `The sum of three consecutive odd numbers is <span class="hl">${puzzle.sum}</span>.<br>` +
      `What is the <span class="hl">${puzzle.ask.ask}</span> among them?`;
    el.message.className = "message";
    el.message.textContent = "";

    renderStep();
    renderChoices();
    renderProgress();
    startTimer();
  }

  function choose(btn, value) {
    if (finished) return;

    if (value === puzzle.answer) {
      finished = true;
      clearInterval(timer);
      btn.classList.add("correct");
      document.querySelectorAll(".answer").forEach(b => { b.disabled = true; });

      const gained = 100 + time * 4 + step * 5;
      score += gained;
      streak += 1;
      el.score.textContent = score;
      el.streak.textContent = streak;

      step = 3;
      renderStep();

      el.message.className = "message win";
      el.message.innerHTML =
        `Treasure unlocked! <b>${puzzle.a} + ${puzzle.b} + ${puzzle.c} = ${puzzle.sum}</b><br>` +
        `The ${puzzle.ask.ask} is <b>${puzzle.answer}</b> · +${gained} points`;
      celebrate();
    } else {
      btn.classList.add("wrong");
      streak = 0;
      el.streak.textContent = streak;
      el.message.className = "message lose";
      el.message.innerHTML = "Almost! Remember: ÷3 to find the middle, then ±2 for the sides.";
      setTimeout(() => btn.classList.remove("wrong"), 650);

      if (step < 2) {
        step += 1;
        renderStep();
      }
    }
  }

  function celebrate() {
    for (let i = 0; i < 60; i++) {
      const p = document.createElement("div");
      p.className = "piece";
      p.style.left = Math.random() * 100 + "%";
      p.style.background = ["#f5c542", "#e85d4a", "#5aa9e6", "#72b84b", "#a66dd1"][i % 5];
      p.style.animationDelay = Math.random() * 0.45 + "s";
      el.confetti.appendChild(p);
      setTimeout(() => p.remove(), 2200);
    }
  }

  document.getElementById("btnPrevStep").addEventListener("click", () => {
    if (step <= 0) return;
    step -= 1;
    renderStep();
  });

  document.getElementById("btnNextStep").addEventListener("click", () => {
    const max = stepsForPuzzle().length - 1;
    if (step >= max) step = 0;
    else step += 1;
    renderStep();
  });

  document.getElementById("btnNextQ").addEventListener("click", () => {
    round += 1;
    loadPuzzle(true);
  });

  loadPuzzle(false);
})();
</script>
</body>
</html>
